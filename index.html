<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Curbside" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Curbside</title>
    <meta name="description" content="Top-down open-world crime and driving." />
    <!-- Link previews. Scrapers need absolute URLs, and these are metadata
         rather than asset loads, so this is the one place the live URL is
         hard-coded instead of following the base path (publicUrl). og.jpg is
         a JPEG so the service worker's precache globs leave it out. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="deeek.org" />
    <meta property="og:title" content="Curbside" />
    <meta property="og:description" content="Top-down open-world crime and driving, right in your browser. Steal, drift, cause chaos. Free, no download, no sign-up." />
    <meta property="og:url" content="https://deeek.org/curbside/" />
    <meta property="og:image" content="https://deeek.org/curbside/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Curbside wordmark and its tagline, steal, drift, cause chaos, over a top-down city junction at dusk." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body data-scene="title">
    <div id="app"></div>
    <!-- HUD, touch controls, radar and menus are built by src/ui/*. -->
    <div id="paused" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
